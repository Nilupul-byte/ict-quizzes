<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Code Tracer</title>

<style>
/* Layout: an exercise-book page (blue rules, red margin) on a desk. Sticky header with the 15-minute clock.
   One task per screen; code printed in a ruled box; trace tables drawn like hand-ruled tables. Single light look on purpose. */
:root{
  --desk:#2B3A55; --page:#FBFCFF; --rule:#DCE5F4; --margin:#E58A8A; --ink:#1C2541; --muted:#5B6685; --line:#C9D4E8;
  --navy:#1F3A7A; --navy-d:#152A5A; --hl:#FFE45C; --ok:#1F8F55; --bad:#C8413B; --mid:#C27C0E;
  --codebg:#F1F4FA;
  --display:"Unbounded","Noto Sans Sinhala",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Noto Sans Sinhala","Iskoola Pota",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--desk)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.book{max-width:860px;margin:0 auto;background-color:var(--page);background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);
  border-radius:6px 14px 14px 6px;box-shadow:0 24px 50px -20px rgba(0,0,0,.55),inset 6px 0 0 #E9EEF8;position:relative;overflow:hidden}
.book::before{content:"";position:absolute;top:0;bottom:0;left:56px;width:2px;background:var(--margin);opacity:.7}
@media (max-width:560px){.book::before{left:30px}}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px 12px 74px;background:rgba(251,252,255,.94);backdrop-filter:blur(4px);border-bottom:2px solid var(--line)}
@media (max-width:560px){.head{padding-left:44px}}
.brand{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.01em}
.clock{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:18px;background:var(--ink);color:#fff;border-radius:8px;padding:3px 10px;font-variant-numeric:tabular-nums}
.clock.low{background:var(--bad)}
.prog{font-family:var(--mono);font-size:14px;color:var(--muted)}
.bar{height:4px;background:var(--line)} .bar i{display:block;height:100%;background:var(--navy);width:0;transition:width .3s}
.pagebody{padding:22px 22px 30px 74px;display:flex;flex-direction:column;gap:16px;position:relative}
@media (max-width:560px){.pagebody{padding:18px 14px 26px 44px}}
.qnum{position:absolute;left:12px;top:20px;width:34px;text-align:right;font-family:var(--display);font-weight:800;font-size:18px;color:var(--margin)}
@media (max-width:560px){.qnum{left:0;width:26px;font-size:14px}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,46px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{background:linear-gradient(transparent 58%,var(--hl) 58% 92%,transparent 92%)}
h2{font-family:var(--display);font-weight:600;font-size:clamp(17px,3vw,20px);line-height:1.45;margin:0}
.muted{color:var(--muted)}
.tag{display:inline-flex;align-self:flex-start;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--navy);border:1.5px solid var(--navy);border-radius:5px;padding:1px 8px}
.how{font-size:15px;color:var(--muted)}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.fact{font-family:var(--mono);font-size:13.5px;font-weight:700;border:1.5px dashed var(--line);border-radius:8px;padding:5px 10px;background:#fff}
label{font-weight:700}
input.nm{font:inherit;padding:11px 13px;border:2px solid var(--line);border-radius:8px;background:#fff;max-width:420px;width:100%}
input.nm:focus{border-color:var(--navy);outline:none}
.btn{font-family:var(--display);font-weight:600;font-size:15.5px;border-radius:10px;padding:12px 20px;align-self:flex-start}
.btn.pri{background:var(--navy);color:#fff;box-shadow:0 4px 0 var(--navy-d)}
.btn.pri:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{border:2px solid var(--line);background:#fff}
.btn:active:not(:disabled){transform:translateY(2px)}
pre.code{margin:0;background:var(--codebg);border:1.5px solid var(--line);border-radius:10px;padding:10px 0;font-family:var(--mono);font-size:15px;line-height:1.75;overflow-x:auto;counter-reset:ln}
pre.code span.l{display:block;padding:0 14px 0 46px;position:relative;white-space:pre}
pre.code span.l::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:30px;text-align:right;color:#9AA6C0;font-size:12.5px}
.kw{color:var(--navy);font-weight:700} .bl{background:var(--hl);border-radius:4px;padding:0 4px;font-weight:700}
.segs,.nums{display:flex;flex-direction:column;gap:10px}
.srow,.nrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
.stxt{display:flex;gap:10px;align-items:center;font-weight:700;min-width:0}
.stxt code,.nrow code{font-family:var(--mono);font-size:15px;font-weight:700}
.sopts{display:flex;gap:6px;flex-wrap:wrap}
.sopts button{font-weight:700;font-size:15px;padding:6px 11px;border-radius:8px;border:1.5px solid var(--line);background:var(--page)}
.sopts button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sopts button.good{background:var(--ok);border-color:var(--ok);color:#fff}
.sopts button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.sopts button.miss{border:2px dashed var(--ok);color:var(--ok)}
.srow.good,.nrow.good{border-color:var(--ok)} .srow.bad,.nrow.bad{border-color:var(--bad)}
input.n{font-family:var(--mono);font-weight:700;font-size:17px;width:110px;padding:7px 10px;border:2px solid var(--line);border-radius:8px;background:var(--page);text-align:center}
input.n:focus{border-color:var(--navy);outline:none}
input.n.good{border-color:var(--ok);color:var(--ok)} input.n.bad{border-color:var(--bad);color:var(--bad)}
.fix{font-family:var(--mono);font-size:13.5px;color:var(--ok);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-weight:700}
.opt .k{font-family:var(--mono);color:var(--muted);flex:none}
.opt code{font-family:var(--mono)}
.opt.on{border-color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy);background:#EEF2FB}
.opt.good{border-color:var(--ok);background:#E5F5EC} .opt.bad{border-color:var(--bad);background:#FBE9E8}
.twrap{overflow-x:auto}
table.trace{border-collapse:collapse;background:#fff;font-family:var(--mono);font-size:15px;min-width:100%}
.trace th,.trace td{border:1.5px solid var(--ink);padding:5px 8px;text-align:center}
.trace th{background:#EEF2FB;font-size:13.5px}
.trace td.it{font-weight:700;color:var(--muted)}
.trace input{font-family:var(--mono);font-weight:700;font-size:16px;width:70px;padding:5px;border:1.5px solid var(--line);border-radius:6px;text-align:center;background:var(--page)}
.trace input.good{border-color:var(--ok);color:var(--ok)} .trace input.bad{border-color:var(--bad);color:var(--bad)}
.tf{display:inline-flex;gap:4px}
.tf button{font-family:var(--mono);font-weight:700;font-size:13px;padding:5px 8px;border-radius:6px;border:1.5px solid var(--line);background:var(--page)}
.tf button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tf button.good{background:var(--ok);border-color:var(--ok);color:#fff} .tf button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.trace small{display:block;font-size:12px;color:var(--ok)}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:2px solid}
.fb.ok{border-color:var(--ok);background:#E9F6EF} .fb.part{border-color:var(--mid);background:#FCF3E2} .fb.no{border-color:var(--bad);background:#FBECEB}
.fb b{font-family:var(--display);font-weight:600;font-size:17px}
.fb.ok b{color:var(--ok)} .fb.part b{color:var(--mid)} .fb.no b{color:var(--bad)}
.score{font-family:var(--display);font-weight:800;font-size:clamp(46px,11vw,76px);line-height:1;color:var(--navy)}
.score small{font-size:.38em;color:var(--muted)}
.result{font-family:var(--mono);font-size:13.5px;line-height:1.55;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;user-select:all;max-height:380px;overflow:auto}
ol.rev{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:4px}
ol.rev .ok{color:var(--ok);font-weight:700} ol.rev .part{color:var(--mid);font-weight:700} ol.rev .bad{color:var(--bad);font-weight:700}
.stmts{display:flex;flex-direction:column;gap:4px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:700}
.stmts code{font-family:var(--mono)}
.ocode{margin:0;font-family:var(--mono);font-size:13.5px;line-height:1.5;text-align:left}
.opt{align-items:flex-start}
.fcwrap{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px;align-self:flex-start;max-width:100%;overflow-x:auto}
.foot{max-width:860px;margin:12px auto 0;font-size:13px;color:#B9C4DA}
</style>
</head>

 e:{si:"num = 1, 3, 5, 7, 9, 11 → එකතුව 36. num + 1 නම් සියලු සංඛ්‍යා එකතු වේ.",en:"num = 1, 3, 5, 7, 9, 11, so the sum is 36. With num + 1, every number would be added."}},
{type:"trace",label:{si:"II · ලුහුබැඳීමේ වගුව",en:"II · Trace table"},tag:"Paper II · 2020 7(iii)",
 q:{si:"පහත ව්‍යාජ කේතය සඳහා ලුහුබැඳීමේ වගුව සම්පූර්ණ කරන්න.",en:"Complete the trace table for the following pseudocode."},
 code:"BEGIN\n  A[0] = 2\n  k = 1\n  value = 2\n  REPEAT\n    value = value * 3\n    A[k] = value\n    k = k + 1\n  UNTIL k > 3\nEND",
 cols:[{h:"value"},{h:"A[k]"},{h:{si:"k (පසුව)",en:"k (after)"}},{h:"k > 3 ?",tf:true}],
 rows:[[6,6,2,"F"],[18,18,3,"F"],[54,54,4,"T"]],
 e:{si:"value: 2 → 6 → 18 → 54. A[1] = 6, A[2] = 18, A[3] = 54. k = 4 වූ විට k > 3 සත්‍ය → නවතී (වට 3යි).",en:"value: 2 → 6 → 18 → 54, so A[1] = 6, A[2] = 18 and A[3] = 54. When k = 4, k > 3 is true and it stops after 3 rounds."}}
];

/* ---------------- state ---------------- */
let name="",i=0,left=LIMIT,tick=null,log=[],t0=0,locked=false,st=null,ended=false;
const app=document.getElementById("app"),clock=document.getElementById("clock");
document.getElementById("brand").textContent=UI.brand;document.documentElement.lang=LANG;
const fmtT=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
const codeHTML=c=>`<pre class="code">${c.split("\n").map(l=>`<span class="l">${esc(l).replace(/\b(REPEAT|UNTIL|WHILE|DO|ENDWHILE|DISPLAY|IF|THEN|ELSE|ENDIF|for|to|downto|do|while|repeat|until)\b/g,'<span class="kw">$1</span>').replace(/([ⒶⒷⒸ])/g,'<span class="bl">$1</span>')||" "}</span>`).join("")}</pre>`;
const lab=x=>esc(T(x));
function setProg(){document.getElementById("prog").textContent=name?UI.of(Math.min(i+1,TASKS.length),TASKS.length):"";document.getElementById("barfill").style.width=(log.length/TASKS.length*100)+"%"}

function start(){
  app.innerHTML=`<h1>${UI.title}</h1><p class="muted" style="font-family:var(--mono);font-size:13.5px">${esc(UI.sub)}</p>
  <p>${esc(UI.intro)}</p><div class="facts">${UI.facts.map(f=>`<span class="fact">${esc(f)}</span>`).join("")}</div>
  <p class="how">${esc(UI.tip)}</p>
  <label for="nm">${esc(UI.nameL)}</label><input class="nm" id="nm" autocomplete="off" placeholder="${esc(UI.nameP)}">
  <button class="btn pri" id="go" disabled>${esc(UI.start)}</button>`;
  const nm=document.getElementById("nm"),go=document.getElementById("go");
  nm.oninput=()=>go.disabled=!nm.value.trim();nm.onkeydown=e=>{if(e.key==="Enter"&&nm.value.trim())go.click()};
  go.onclick=()=>{name=nm.value.trim();t0=Date.now();left=LIMIT;
    tick=setInterval(()=>{left=Math.max(0,LIMIT-Math.floor((Date.now()-t0)/1000));clock.textContent=fmtT(left);clock.classList.toggle("low",left<=120);if(left<=0)timeUp()},500);
    show()};
}
function show(){
  const t=TASKS[i];locked=false;st={sel:{},pick:null};setProg();
  let body="";
  if(t.type==="seg")body=`<div class="segs">${t.rows.map((r,k)=>{const opts=t.rowOpts?r.o:t.opts;
    return `<div class="srow" data-r="${k}"><div class="stxt">${r.svg?SHAPE[r.svg]:""}${r.t!==""?(t.mono||t.rowOpts?`<code>${lab(r.t)}</code>`:`<span>${lab(r.t)}</span>`):""}</div><div class="sopts">${opts.map((o,v)=>`<button data-r="${k}" data-v="${v}">${t.rowOpts?`<code style="font-family:var(--mono)">${lab(o)}</code>`:lab(o)}</button>`).join("")}</div></div>`}).join("")}</div>`;
  if(t.type==="num")body=`<div class="nums">${t.rows.map((r,k)=>`<div class="nrow" data-r="${k}"><code>${lab(r.t)}</code><span><input class="n" data-r="${k}" inputmode="numeric" autocomplete="off"><span class="fix"></span></span></div>`).join("")}</div>`;
  if(t.type==="choose")body=`${t.fc?`<div class="fcwrap">${FC(FCL[LANG])}</div>`:""}${t.st?`<div class="stmts">${t.st.map(x=>`<p>${t.mono?`<code>${lab(x)}</code>`:lab(x)}</p>`).join("")}</div>`:""}${t.q2?`<h2>${lab(t.q2)}</h2>`:""}
   <div class="opts">${t.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">(${k+1})</span>${t.mono&&String(T(o)).includes("\n")?`<pre class="ocode">${esc(T(o))}</pre>`:t.mono?`<code>${lab(o)}</code>`:`<span>${lab(o)}</span>`}</button>`).join("")}</div>`;
  if(t.type==="trace")body=`<div class="twrap"><table class="trace"><thead><tr><th>${esc(UI.round)}</th>${t.cols.map(c=>`<th>${lab(c.h)}</th>`).join("")}</tr></thead><tbody>${t.rows.map((row,r)=>`<tr><td class="it">${r+1}</td>${t.cols.map((c,ci)=>`<td data-r="${r}" data-c="${ci}">${c.tf?`<span class="tf"><button data-r="${r}" data-c="${ci}" data-v="T">${UI.T}</button><button data-r="${r}" data-c="${ci}" data-v="F">${UI.F}</button></span>`:`<input data-r="${r}" data-c="${ci}" inputmode="numeric" autocomplete="off">`}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const how={seg:UI.howSeg,num:UI.howNum,choose:UI.howChoose,trace:UI.howTrace}[t.type];
  app.innerHTML=`<span class="qnum">${i+1}</span><span class="tag">${esc(t.tag||"")}</span><h2>${lab(t.q)}</h2>${t.code?codeHTML(t.code):""}<p class="how">${esc(how)}</p>${body}
   <button class="btn pri" id="chk">${esc(UI.check)}</button><div id="fb"></div>`;
  app.onclick=e=>{const b=e.target.closest("button");if(!b||locked)return;
    if(b.closest(".sopts")){st.sel[b.dataset.r]=+b.dataset.v;b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))}
    if(b.closest(".tf")){st.sel[b.dataset.r+"_"+b.dataset.c]=b.dataset.v;b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))}
    if(b.classList.contains("opt")){st.pick=+b.dataset.k;app.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",x===b))}};
  document.getElementById("chk").onclick=()=>check(false);
  window.scrollTo({top:0});
}
const numIn=v=>{const s=String(v).trim();return s===""?null:Number(s)};
function check(timeout){
  if(locked)return;locked=true;const t=TASKS[i];let frac=0,mine=[],right=[];
  if(t.type==="seg"){let n=0;t.rows.forEach((r,k)=>{const opts=t.rowOpts?r.o:t.opts,v=st.sel[k],ok=v===r.a;if(ok)n++;
      const row=app.querySelector(`.srow[data-r="${k}"]`);row.classList.add(ok?"good":"bad");
      row.querySelectorAll("button").forEach(b=>{const bv=+b.dataset.v;b.disabled=true;b.classList.remove("on");if(bv===r.a)b.classList.add(ok?"good":"miss");else if(bv===v)b.classList.add("bad")});
      const nm=r.t!==""?T(r.t)+"=":(k+1)+"=";mine.push(nm+(v!=null?T(opts[v]):"—"));right.push(nm+T(opts[r.a]))});frac=n/t.rows.length}
  if(t.type==="num"){let n=0;t.rows.forEach((r,k)=>{const inp=app.querySelector(`input.n[data-r="${k}"]`),v=numIn(inp.value),ok=v===r.a;if(ok)n++;
      inp.disabled=true;inp.classList.add(ok?"good":"bad");if(!ok)inp.nextElementSibling.textContent=" ✓ "+r.a;app.querySelector(`.nrow[data-r="${k}"]`).classList.add(ok?"good":"bad");
      mine.push(T(r.t)+"="+(v==null?"—":v));right.push(T(r.t)+"="+r.a)});frac=n/t.rows.length}
  if(t.type==="choose"){const ok=st.pick===t.a;frac=ok?1:0;
      app.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.k;b.disabled=true;b.classList.remove("on");if(k===t.a)b.classList.add("good");else if(k===st.pick)b.classList.add("bad")});
      mine.push(st.pick==null?"—":"("+(st.pick+1)+")");right.push("("+(t.a+1)+")")}
  if(t.type==="trace"){let n=0,tot=0;
      t.rows.forEach((row,r)=>{const rm=[],rr=[];t.cols.forEach((c,ci)=>{tot++;const want=row[ci];let v,ok;
        if(c.tf){v=st.sel[r+"_"+ci]||null;ok=v===want;app.querySelectorAll(`.tf button[data-r="${r}"][data-c="${ci}"]`).forEach(b=>{b.disabled=true;b.classList.remove("on");if(b.dataset.v===want)b.classList.add(ok?"good":"good");else if(b.dataset.v===v)b.classList.add("bad")})}
        else{const inp=app.querySelector(`.trace input[data-r="${r}"][data-c="${ci}"]`);v=numIn(inp.value);ok=v===want;inp.disabled=true;inp.classList.add(ok?"good":"bad");
          if(!ok){const s=document.createElement("small");s.textContent="✓ "+want;inp.parentNode.appendChild(s)}}
        if(ok)n++;rm.push(v==null?"—":v);rr.push(want)});mine.push("["+rm.join(",")+"]");right.push("["+rr.join(",")+"]")});frac=n/tot}
  frac=Math.round(frac*100)/100;
  log.push({frac,mine:mine.join("  "),right:right.join("  "),blank:timeout&&mine.every(m=>/—|\[—/.test(m))});
  setProg();
  const c=document.getElementById("chk");if(c)c.remove();
  if(timeout)return;
  const cls=frac===1?"ok":frac>0?"part":"no",head=frac===1?UI.ok:frac>0?UI.part:UI.bad;
  const fb=document.getElementById("fb");const last=i+1>=TASKS.length;
  fb.innerHTML=`<div class="fb ${cls}"><b>${esc(head)}</b><p>${esc(T(t.e))}</p></div><button class="btn pri" id="nx" style="margin-top:12px">${esc(last?UI.finish:UI.next)}</button>`;
  fb.scrollIntoView({behavior:"smooth",block:"nearest"});
  document.getElementById("nx").onclick=()=>{i++;i<TASKS.length?show():finish(false)};
}
function timeUp(){if(ended)return;
  if(!locked&&i<TASKS.length)check(true);
  for(let k=log.length;k<TASKS.length;k++)log.push({frac:0,mine:UI.blank,right:"",blank:true});
  finish(true)}
function finish(timeout){
  if(ended)return;ended=true;clearInterval(tick);
  const used=Math.min(LIMIT,Math.floor((Date.now()-t0)/1000));
  const sum=Math.round(log.reduce((a,b)=>a+b.frac,0)*10)/10,pct=Math.round(sum/TASKS.length*100);
  i=TASKS.length;setProg();document.getElementById("prog").textContent="";clock.textContent=fmtT(used);clock.classList.remove("low");
  const mark=f=>f===1?"✓":f>0?"~":"✗";
  const lines=TASKS.map((t,k)=>{const L=log[k];let s=`${k+1}. ${mark(L.frac)} ${T(t.label)}`;
    if(L.frac<1){s+=`\n   ${UI.you}: ${L.mine||UI.blank}`;if(L.right)s+=`\n   ${UI.ans}: ${L.right}`}return s});
  const txt=`${UI.resT}\n${UI.resName}: ${name}\n${UI.resScore}: ${sum} / ${TASKS.length} (${pct}%)\n${UI.resTime}: ${fmtT(used)}${timeout?" ("+UI.timeUp+")":""}\n\n${lines.join("\n")}`;
  app.innerHTML=`<span class="tag">${esc(timeout?UI.timeUp:UI.done)}</span><h1>${esc(name)}</h1>
   <p class="score">${sum}<small> / ${TASKS.length} · ${pct}%</small></p><p class="muted">${esc(UI.timeL)}: ${fmtT(used)}</p>
   <p><b>${esc(UI.send)}</b></p><div class="result" id="res">${esc(txt)}</div>
   <button class="btn pri" id="cp">${esc(UI.copy)}</button><p id="cpm" class="how" aria-live="polite"></p>
   <p class="muted" style="font-weight:700">${esc(UI.review)}</p>
   <ol class="rev">${TASKS.map((t,k)=>{const f=log[k].frac;return `<li><span class="${f===1?"ok":f>0?"part":"bad"}">${mark(f)}</span> ${lab(t.label)}</li>`}).join("")}</ol>`;
  window.scrollTo({top:0});
  try{localStorage.setItem("codetracer-l01-"+LANG,txt)}catch(e){}
  document.getElementById("cp").onclick=()=>{const m=document.getElementById("cpm");
    const sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("res"));const s=getSelection();s.removeAllRanges();s.addRange(r);m.textContent=UI.selected};
    try{navigator.clipboard.writeText(txt).then(()=>m.textContent=UI.copied,sel)}catch(e){sel()}};
}
start();
</script>
</body>
