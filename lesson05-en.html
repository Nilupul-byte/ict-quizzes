<style>
/* Layout: notebook-grid ground; one rounded game card per screen; HUD with progress dots on top; scenario sheet (collapsible) above each question */
:root{
  --bg:#EDF2FB; --dot:#D3DDF0; --card:#FFFFFF; --soft:#F5F8FE; --ink:#18213D; --muted:#56628A; --line:#D5DDEE;

  --ok:#17914B; --bad:#D93B42; --mid:#C98300;
  --t1:#D9423A; --t2:#2A6AD4; --t3:#7B4FD6; --t4:#23874A; --t-ink:#FFFFFF; --t-deep:rgba(0,0,0,.28);
  --h-mcq:#2A6AD4; --h-pick:#FF7A2F; --h-tf:#0E9F9A; --h-match:#7B4FD6; --h-rows:#D9423A; --h-fill:#23874A; --h-multi:#C98300; --h-bits:#0E7FB8; --h-order:#B8458A; --h-input:#5B6B1E;
  --display:"Fredoka","Noto Sans Sinhala",system-ui,sans-serif;
  --body:"Lexend","Noto Sans Sinhala","Iskoola Pota",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11162A; --dot:#1E2644; --card:#1B2240; --soft:#151B34; --ink:#EEF1FF; --muted:#A0AACC; --line:#2D3660;
  --brand:#FF8A45; --brand-deep:#C2520F; --accent-text:#FF9A5C; --brand-ink:#2A1200; --ok:#3FCF7F; --bad:#FF6B70; --mid:#F2B33D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11162A; --dot:#1E2644; --card:#1B2240; --soft:#151B34; --ink:#EEF1FF; --muted:#A0AACC; --line:#2D3660;

*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);background-size:22px 22px;color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
p{margin:0}

.pills{display:flex;gap:8px;flex-wrap:wrap}

.opt.on .box::after{content:"✓"}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.rlist{display:flex;flex-direction:column;gap:10px}
.rhead{font-family:var(--mono);font-size:13px;color:var(--muted)}
.rrow{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.rrow code{font-family:var(--mono);font-size:14px;font-weight:700}
.seg{display:flex;gap:8px}
.seg button{font-family:var(--display);font-weight:600;padding:7px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.seg button.on[data-v="1"]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on[data-v="0"]{background:var(--bad);border-color:var(--bad);color:#fff}
.rrow.good{border-color:var(--ok)} .rrow.bad{border-color:var(--bad)}
.why{flex-basis:100%;font-size:14px;color:var(--muted)}
.why b{color:var(--ink)}
.flist{display:flex;flex-direction:column;gap:12px}
.frow{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.frow p{font-weight:600}
.frow .chips button{font-family:var(--display);font-weight:600;font-size:15px;padding:6px 13px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.frow .chips button.on{background:var(--h-fill);border-color:var(--h-fill);color:#fff}
.frow .chips button.good{background:var(--ok);border-color:var(--ok);color:#fff}
.frow .chips button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.frow .chips button.miss{border:2px dashed var(--ok);color:var(--ok)}
.frow.good{border-color:var(--ok)} .frow.bad{border-color:var(--bad)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.mgrid{grid-template-columns:1fr}}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mcol h3{margin:0;font-family:var(--display);font-size:14px;font-weight:600;color:var(--muted)}
.mi{display:flex;gap:10px;align-items:center;text-align:left;padding:11px 12px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-weight:500;min-height:52px}
.mi .tag{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--soft);border:2px solid var(--line)}
.mi.cur{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 22%,transparent)}
.mi.p0{border-color:var(--t1)}.mi.p0 .tag{background:var(--t1);border-color:var(--t1);color:#fff}
.mi.p1{border-color:var(--t2)}.mi.p1 .tag{background:var(--t2);border-color:var(--t2);color:#fff}
.mi.p2{border-color:var(--t3)}.mi.p2 .tag{background:var(--t3);border-color:var(--t3);color:#fff}
.mi.p3{border-color:var(--t4)}.mi.p3 .tag{background:var(--t4);border-color:var(--t4);color:#fff}
.mi.good{outline:3px solid var(--ok);outline-offset:2px} .mi.bad{outline:3px solid var(--bad);outline-offset:2px}
.mi small{display:block;color:var(--ok);font-size:13px}
.picked{font-size:15px}
.picked b{font-family:var(--mono)}
.feedback{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border:2px solid var(--line)}
.feedback .fh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.feedback .fh b{font-family:var(--display);font-size:24px}
.feedback .fh span{font-family:var(--display);font-weight:600;font-size:18px}
.feedback.ok{background:color-mix(in srgb,var(--ok) 13%,var(--card));border-color:var(--ok)} .feedback.ok b{color:var(--ok)}
.feedback.part{background:color-mix(in srgb,var(--mid) 13%,var(--card));border-color:var(--mid)} .feedback.part b{color:var(--mid)}
.feedback.no{background:color-mix(in srgb,var(--bad) 11%,var(--card));border-color:var(--bad)} .feedback.no b{color:var(--bad)}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.9);opacity:.3}100%{transform:scale(1);opacity:1}}
.stars{display:flex;gap:8px}
.star{width:44px;height:44px;background:var(--line);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.star.on{background:var(--mid)}
.big{font-family:var(--display);font-size:clamp(56px,13vw,88px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--brand)}
.result{font-family:var(--mono);font-size:13.5px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;white-space:pre-wrap;user-select:all}
.row{display:flex;gap:12px;flex-wrap:wrap}
ol.review{margin:0;padding-left:28px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
ol.review .s{font-family:var(--display);font-weight:700;margin-right:6px}
ol.review .ok{color:var(--ok)} ol.review .part{color:var(--mid)} ol.review .bad{color:var(--bad)}
.foot{font-size:13px;color:var(--muted)}

.banner .intro{flex-basis:100%;font-size:14.5px;color:var(--muted)}
.bits{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.bit{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;border-radius:14px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);transition:transform .08s}
.bit:active:not(:disabled){transform:translateY(3px)}
.bit small{font-family:var(--mono);font-size:12px;color:var(--muted)}

.pool{display:flex;gap:8px;flex-wrap:wrap}

.inrow{display:flex;align-items:flex-end;gap:6px}
.ia{font-family:var(--mono);font-size:clamp(22px,6vw,30px);font-weight:700;letter-spacing:.08em;padding:10px 14px;border-radius:14px;max-width:420px}

.cn{font-size:1.5em;line-height:1;color:var(--accent-text);vertical-align:-.08em}

const UI=Object.assign({},UIS[LANG],LESSON.ui[LANG]);
const SC=LESSON.SC, Q=LESSON.Q;

let name="",i=0,score=0,streak=0,log=[],tick=null,left=TIME,locked=false,st=null;
const app=document.getElementById("app"),pills=document.getElementById("pills"),dots=document.getElementById("dots");
document.getElementById("brand").textContent=UI.brand;
document.documentElement.lang=LANG;
const needsCheck=t=>!(t==="mcq"||t==="tf");
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const norm=(v,q)=>{let n=String(v).toUpperCase().replace(/[^0-9A-F]/g,"");if(q.strip0!==false)n=n.replace(/^0+(?=.)/,"");return n};
const grp4=s=>s.replace(/(.{4})(?=.)/g,"$1 ");

function hud(){
  pills.innerHTML=name?`<span class="pill">${esc(name)}</span><span class="pill">${score} ${esc(UI.pts)}</span>${streak>=2?`<span class="pill hot">${esc(UI.streak(streak))}</span>`:""}`:"";
  dots.innerHTML=Q.map((_,k)=>`<i class="${k<log.length?(log[k]===1?"ok":log[k]>0?"part":"bad"):k===i&&name?"cur":""}"></i>`).join("");
}

function start(){
  name="";log=[];hud();dots.hidden=true;
  const tk=[...new Set(Q.map(q=>q.type))];
  app.innerHTML=`<h1>${esc(UI.title)}</h1><p class="sub">${esc(UI.sub)}</p>
  <p>${esc(UI.intro)}</p>
  <div class="facts">${[UI.nq(Q.length),UI.nt(tk.length),UI.tm].map(f=>`<span class="fact">${esc(f)}</span>`).join("")}</div>
  <p class="muted" style="font-weight:600">${esc(UI.typesL)}</p>
  <div class="chips">${tk.map(k=>`<span class="chip" style="--h:var(--h-${k})">${esc(UI.types[k])}</span>`).join("")}</div>
  <p class="muted">${esc(UI.rules)}</p>
  <label for="nm">${esc(UI.nameL)}</label><input id="nm" autocomplete="off" placeholder="${esc(UI.nameP)}">
  <button class="btn primary" id="go" disabled>${esc(UI.start)}</button>`;
  const nm=document.getElementById("nm"),go=document.getElementById("go");
  nm.oninput=()=>go.disabled=!nm.value.trim();
  nm.onkeydown=e=>{if(e.key==="Enter"&&nm.value.trim())go.click()};
  go.onclick=()=>{name=nm.value.trim();i=0;score=0;streak=0;log=[];dots.hidden=false;show()};
}

function tableHTML(t,ti,q){
  const pick=q.type==="pick"&&q.tbl===ti, sub=T(t.s);
  return `<div class="tbl${pick?" pickme":""}"><div class="tn"><b>${esc(t.n)}</b>${sub?` (${esc(sub)})`:""}${pick?`<span class="tapme">${esc(UI.tapHere)}</span>`:""}</div>
  <table><thead><tr>${t.c.map((c,ci)=>`<th data-c="${ci}">${pick?`<button class="colbtn" data-c="${ci}">${esc(c)}</button>`:esc(c)}</th>`).join("")}</tr></thead>
  <tbody>${t.r.map(r=>`<tr>${r.map((v,ci)=>`<td data-c="${ci}">${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function scenHTML(sc,q){
  const hasBody=(sc.t&&sc.t.length)||sc.note||sc.code||sc.out;
  if(!hasBody)return `<div class="banner"><span class="range">${fx(sc.range)}</span><span class="stitle">${fx(sc.title)}</span>${sc.intro?`<p class="intro">${fx(sc.intro)}</p>`:""}</div>`;
  return `<details class="scen" open><summary><span class="range">${fx(sc.range)}</span><span class="stitle">${fx(sc.title)}</span></summary>
  <div class="sbody">${sc.intro?`<p class="intro">${fx(sc.intro)}</p>`:""}
  ${sc.t&&sc.t.length?`<div class="tables">${sc.t.map((t,ti)=>tableHTML(t,ti,q)).join("")}</div>`:""}
  ${sc.out||sc.code?`<div class="figs">${sc.out?`<div class="fig"><p class="figcap">${esc(UI.fig1)}</p><div class="figpage" data-out="${q.s}"></div></div>`:""}${sc.code?`<div class="fig"><p class="figcap">${esc(UI.fig2)}</p><pre class="codeblk">${hl(sc.code)}</pre></div>`:""}</div>`:""}
  ${sc.note?`<p class="note"><b>${esc(UI.note)}</b> ${fx(sc.note)}</p>`:""}</div></details>`;
}
function shuffled(n){let a=[...Array(n).keys()];do{for(let k=n-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}}while(n>2&&a.every((v,k)=>v===k));return a}

function areaHTML(q){
  switch(q.type){
  case "mcq": return `<div class="answers">${q.o.map((o,k)=>`<button class="ans c${k}" data-k="${k}"><span class="sh">${SH[k]}</span><span class="no">(${k+1})</span><span>${fx(o)}</span></button>`).join("")}</div>`;
  case "tf": return `<div class="tfgrid"><button class="ans c3" data-k="1">${esc(UI.tru)}</button><button class="ans c0" data-k="0">${esc(UI.fls)}</button></div>`;
  case "pick": return `<p class="picked">${esc(UI.picked)} <b id="pk">${esc(UI.none)}</b></p>`;
  case "multi": return `<div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="box"></span><span>${fx(o)}</span></button>`).join("")}</div>`;
  case "rows": {const lb=q.labels?q.labels.map(T):[UI.acc,UI.rej];
    const head=q.tbl!=null?(()=>{const t=SC[q.s].t[q.tbl];return `<p class="rhead">${esc(t.n)} (${t.c.map(esc).join(", ")})</p>`})():"";
    return `<div class="rlist">${head}${q.rows.map((r,k)=>`<div class="rrow" data-r="${k}"><code>${r.t?fx(r.t):`(${r.v.map(esc).join(", ")})`}</code>
    <div class="seg"><button data-r="${k}" data-v="1">${esc(lb[0])}</button><button data-r="${k}" data-v="0">${esc(lb[1])}</button></div><p class="why" hidden></p></div>`).join("")}</div>`;}
  case "fill": return `<div class="flist">${q.items.map((it,k)=>`<div class="frow" data-r="${k}"><p>${fx(it.t)}</p><div class="chips">${q.opts.map((o,v)=>`<button data-r="${k}" data-v="${v}">${fx(o)}</button>`).join("")}</div></div>`).join("")}</div>`;
  case "match": st.order=shuffled(q.R.length);
    return `<div class="mgrid"><div class="mcol"><h3>${esc(UI.mL)}</h3>${q.L.map((l,k)=>`<button class="mi" data-l="${k}"><span class="tag">${LET[k]}</span><span>${fx(l)}</span></button>`).join("")}</div>
    <div class="mcol"><h3>${esc(UI.mR)}</h3>${st.order.map(r=>`<button class="mi" data-r="${r}"><span class="tag"></span><span>${fx(q.R[r])}<small hidden></small></span></button>`).join("")}</div></div>`;
  case "bits": st.bits=Array(q.n).fill(0);
    return `<div class="bits">${st.bits.map((_,k)=>`<button class="bit" data-b="${k}"><small>${2**(q.n-1-k)}</small><b>0</b></button>`).join("")}</div>
    <p class="picked">${esc(UI.bitsNow)} <b id="bv"></b></p>`;
  case "order": st.seq=[];st.pool=shuffled(q.items.length);
    return `${q.ends?`<p class="ends">1 = ${esc(T(q.ends)[0])} · ${q.items.length} = ${esc(T(q.ends)[1])}</p>`:""}<ol class="slots" id="slots"></ol><div class="pool" id="pool"></div>`;
  case "input":
    return `<div class="inrow"><input id="ia" class="ia" inputmode="none" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="${esc(UI.ansL)}" placeholder="${esc(UI.ansL)}"><span class="basesub">${q.base?`<sub>${q.base}</sub>`:""}</span></div>
    <div class="keypad">${[...q.keys].map(c=>`<button data-key="${c}">${c}</button>`).join("")}<button data-key="DEL" class="del" aria-label="Delete">⌫</button></div>`;
  }
}

function ready(q){
  if(q.type==="pick"||q.type==="multi")return st.sel.size>0;
  if(q.type==="rows")return Object.keys(st.map).length===q.rows.length;
  if(q.type==="fill")return Object.keys(st.map).length===q.items.length;
  if(q.type==="match")return Object.keys(st.map).length===q.L.length;
  if(q.type==="bits")return true;
  if(q.type==="order")return st.seq.length===q.items.length;
  if(q.type==="input")return norm(document.getElementById("ia").value,{strip0:false}).length>0;
  return false;
}
function paint(q){
  if(q.type==="pick"){
    app.querySelectorAll(".pickme [data-c]").forEach(el=>{if(el.tagName!=="BUTTON")el.classList.toggle("on",st.sel.has(+el.dataset.c))});
    const t=SC[q.s].t[q.tbl];document.getElementById("pk").textContent=st.sel.size?[...st.sel].sort().map(c=>t.c[c]).join(" + "):UI.none;
  }
  if(q.type==="multi")app.querySelectorAll(".opt").forEach(b=>b.classList.toggle("on",st.sel.has(+b.dataset.k)));
  if(q.type==="rows"||q.type==="fill")app.querySelectorAll("button[data-v]").forEach(b=>b.classList.toggle("on",st.map[b.dataset.r]===+b.dataset.v));
  if(q.type==="match"){
    app.querySelectorAll(".mi[data-l]").forEach(b=>{const l=+b.dataset.l;b.className="mi"+(st.cur===l?" cur":"")+(st.map[l]!=null?" p"+(l%4):"")});
    app.querySelectorAll(".mi[data-r]").forEach(b=>{const r=+b.dataset.r;const owner=Object.keys(st.map).find(k=>st.map[k]===r);
      b.className="mi"+(owner!=null?" p"+(owner%4):"");b.querySelector(".tag").textContent=owner!=null?LET[owner]:""});
  }
  if(q.type==="bits"){
    app.querySelectorAll(".bit").forEach(b=>{const k=+b.dataset.b;b.classList.toggle("on",!!st.bits[k]);b.querySelector("b").textContent=st.bits[k]});
    document.getElementById("bv").textContent=grp4(st.bits.join(""));
  }
  if(q.type==="order"){
    document.getElementById("slots").innerHTML=q.items.map((_,k)=>{const it=st.seq[k];
      return `<li><button class="slot${it==null?" empty":""}" data-s="${k}" ${it==null?"disabled":""}>${it==null?esc(UI.empty):fx(q.items[it])}</button></li>`}).join("");
    document.getElementById("pool").innerHTML=st.pool.filter(p=>!st.seq.includes(p)).map(p=>`<button data-p="${p}">${fx(q.items[p])}</button>`).join("");
  }
  const c=document.getElementById("check");if(c)c.disabled=!ready(q);
}

function show(){
  const q=Q[i],sc=SC[q.s];locked=false;left=TIME;st={sel:new Set(),map:{},cur:null};
  hud();
  const C=2*Math.PI*21;
  app.innerHTML=`<div class="qhead"><span class="chip" style="--h:var(--h-${q.type})">${esc(UI.types[q.type])}</span><span class="qno">${esc(UI.qOf(i+1,Q.length))}</span>
   <div class="ring" id="ring"><svg width="52" height="52" viewBox="0 0 52 52"><circle class="tr" cx="26" cy="26" r="21" fill="none" stroke-width="6"/><circle class="fg" id="arc" cx="26" cy="26" r="21" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><b id="sec">${fmt(TIME)}</b></div></div>
  ${scenHTML(sc,q)}
  <h2 class="qtext"><span class="num">${i+1}.</span> ${fx(q.q)}</h2>
  ${q.st?`<div class="stmts">${q.st.map(s=>{const x=T(s);return `<p><b>${esc(x.slice(0,1))}</b>${fx(x.slice(1))}</p>`}).join("")}</div><h2>${fx(q.q2)}</h2>`:""}
  <p class="how" style="--h:var(--h-${q.type})">${esc(UI.how[q.type])}</p>
  <div id="area">${areaHTML(q)}</div>
  ${needsCheck(q.type)?`<button class="btn primary" id="check" disabled>${esc(UI.check)}</button>`:""}
  <div id="fb"></div>`;
  app.querySelectorAll(".figpage[data-out]").forEach(el=>{const r=el.attachShadow({mode:"open"});
    r.innerHTML=`<style>:host{display:block;background:#fff;color:#000;font:16px/normal "Times New Roman",Times,serif;letter-spacing:normal;padding:8px 10px}a{pointer-events:none}</style>`+SC[el.dataset.out].out});
  bind(q);
  window.scrollTo({top:0});
  clearInterval(tick);
  tick=setInterval(()=>{left-=.2;
    const arc=document.getElementById("arc"),sec=document.getElementById("sec"),ring=document.getElementById("ring");
    if(arc)arc.style.strokeDashoffset=C*(1-Math.max(0,left)/TIME);
    if(sec)sec.textContent=fmt(Math.max(0,Math.ceil(left)));
    if(ring)ring.classList.toggle("low",left<=15);
    if(left<=0){needsCheck(q.type)?check(q,true):answer(q,-1)}},200);
}

function bind(q){
  if(!needsCheck(q.type)){app.querySelectorAll("#area .ans").forEach(b=>b.onclick=()=>answer(q,+b.dataset.k));return}
  document.getElementById("check").onclick=()=>check(q,false);
  if(q.type==="pick")app.querySelectorAll(".pickme [data-c]").forEach(el=>{if(el.tagName==="TH")return;el.onclick=e=>{e.stopPropagation();if(locked)return;const c=+el.dataset.c;st.sel.has(c)?st.sel.delete(c):st.sel.add(c);paint(q)}});
  if(q.type==="input"){const ia=document.getElementById("ia");
    ia.oninput=()=>{const allowed=new Set([...q.keys," "]);ia.value=[...ia.value.toUpperCase()].filter(c=>allowed.has(c)).join("");paint(q)};
    ia.onkeydown=e=>{if(e.key==="Enter"&&ready(q))check(q,false)};}
  const area=document.getElementById("area");
  area.onclick=e=>{const b=e.target.closest("button");if(!b||locked)return;
    if(q.type==="multi"){const k=+b.dataset.k;st.sel.has(k)?st.sel.delete(k):st.sel.add(k)}
    else if(q.type==="rows"||q.type==="fill"){st.map[b.dataset.r]=+b.dataset.v}
    else if(q.type==="match"){
      if(b.dataset.l!=null){const l=+b.dataset.l;if(st.map[l]!=null)delete st.map[l];st.cur=l}
      else if(b.dataset.r!=null&&st.cur!=null){const r=+b.dataset.r;for(const k in st.map)if(st.map[k]===r)delete st.map[k];st.map[st.cur]=r;
        const nx=q.L.findIndex((_,k)=>st.map[k]==null);st.cur=nx>=0?nx:null}
    }
    else if(q.type==="bits"&&b.dataset.b!=null){const k=+b.dataset.b;st.bits[k]=st.bits[k]?0:1}
    else if(q.type==="order"){if(b.dataset.p!=null)st.seq.push(+b.dataset.p);else if(b.dataset.s!=null)st.seq.splice(+b.dataset.s,1)}
    else if(q.type==="input"&&b.dataset.key){const ia=document.getElementById("ia");ia.value=b.dataset.key==="DEL"?ia.value.slice(0,-1):ia.value+b.dataset.key}
    paint(q)};
  if(q.type==="match")st.cur=0;
  paint(q);
}

function setScore(frac){
  let pts=0,bonus=false;
  if(frac>0)pts=Math.round((500+500*Math.max(0,left)/TIME)*frac);
  if(frac===1){streak++;if(streak>=3){pts+=100;bonus=true}}else streak=0;
  score+=pts;log.push(frac);hud();return {pts,bonus};
}
function feedback(q,frac,r,timeout,extra){
  const cls=frac===1?"ok":frac>0?"part":"no";
  const head=frac===1?UI.ok:frac>0?UI.part:(timeout?UI.time:UI.bad);
  const fb=document.getElementById("fb");
  fb.innerHTML=`<div class="feedback ${cls} pop"><div class="fh"><b>${esc(head)}</b><span>+${r.pts}${r.bonus?` (${esc(UI.bonus)})`:""}</span></div>${extra?`<p><strong>${extra}</strong></p>`:""}<p>${fx(q.e)}</p></div>
  <button class="btn primary" id="nx" style="margin-top:14px">${esc(i+1<Q.length?UI.next:UI.results)}</button>`;
  if(frac===1)confetti();
  fb.scrollIntoView({behavior:RM?"auto":"smooth",block:"nearest"});
  const nx=document.getElementById("nx");nx.focus({preventScroll:true});
  nx.onclick=()=>{i++;i<Q.length?show():finish()};
}
function answer(q,k){
  if(locked)return;locked=true;clearInterval(tick);
  const correct=q.type==="tf"?(q.a?1:0):q.a, ok=k===correct;
  app.querySelectorAll("#area .ans").forEach(b=>{const n=+b.dataset.k;b.disabled=true;
    if(n===correct)b.classList.add("right");else if(n===k)b.classList.add("wrong");else b.classList.add("dim")});
  const r=setScore(ok?1:0);
  feedback(q,ok?1:0,r,k<0,!ok&&q.type==="mcq"?esc(UI.ans(q.a+1)):null);
}
function setFrac(sel,correct){const C=new Set(correct);let hit=0,wrong=0;sel.forEach(x=>C.has(x)?hit++:wrong++);return (hit===C.size&&wrong===0)?1:Math.max(0,(hit-wrong)/C.size)}
function check(q,timeout){
  if(locked)return;locked=true;clearInterval(tick);
  const c=document.getElementById("check");if(c)c.remove();
  let frac=0,extra=null;
  if(q.type==="pick"){frac=setFrac(st.sel,q.cols);const C=new Set(q.cols);
    app.querySelectorAll(".pickme th").forEach(th=>{const k=+th.dataset.c;th.classList.remove("on");
      if(C.has(k))th.classList.add(st.sel.has(k)?"good":"miss");else if(st.sel.has(k))th.classList.add("bad")});
    app.querySelectorAll(".pickme td.on").forEach(td=>td.classList.remove("on"));}
  if(q.type==="multi"){frac=setFrac(st.sel,q.ans);const C=new Set(q.ans);
    app.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.k;b.disabled=true;
      if(C.has(k))b.classList.add(st.sel.has(k)?"good":"miss");else if(st.sel.has(k))b.classList.add("bad")});}
  if(q.type==="rows"){let n=0;const lb=q.labels?q.labels.map(T):[UI.acc,UI.rej];
    q.rows.forEach((r,k)=>{const row=app.querySelector(`.rrow[data-r="${k}"]`),ok=st.map[k]===r.a;if(ok)n++;
      row.classList.add(ok?"good":"bad");const w=row.querySelector(".why");w.hidden=false;
      w.innerHTML=`<b>${esc(r.a?lb[0]:lb[1])}.</b> ${fx(r.why)}`;row.querySelectorAll("button").forEach(b=>b.disabled=true)});
    frac=n/q.rows.length;}
  if(q.type==="fill"){let n=0;
    q.items.forEach((it,k)=>{const row=app.querySelector(`.frow[data-r="${k}"]`),ok=st.map[k]===it.a;if(ok)n++;
      row.classList.add(ok?"good":"bad");
      row.querySelectorAll("button").forEach(b=>{const v=+b.dataset.v;b.disabled=true;b.classList.remove("on");
        if(v===it.a)b.classList.add(ok?"good":"miss");else if(v===st.map[k])b.classList.add("bad")})});
    frac=n/q.items.length;}
  if(q.type==="match"){let n=0;st.cur=null;paint(q);
    q.L.forEach((_,l)=>{const b=app.querySelector(`.mi[data-l="${l}"]`),ok=st.map[l]===l;if(ok)n++;b.classList.add(ok?"good":"bad");b.disabled=true;
      if(!ok){const sm=document.createElement("small");sm.innerHTML=`${esc(UI.right)} ${fx(q.R[l])}`;b.querySelector("span:last-child").appendChild(sm)}});
    app.querySelectorAll(".mi[data-r]").forEach(b=>b.disabled=true);
    frac=n/q.L.length;}
  if(q.type==="bits"){const s=st.bits.join("");frac=s===q.ans?1:0;
    app.querySelectorAll(".bit").forEach(b=>{const k=+b.dataset.b;b.disabled=true;b.classList.add(String(st.bits[k])===q.ans[k]?"good":"bad")});
    if(!frac)extra=`${esc(UI.right)} ${grp4(q.ans)}<sub>2</sub>`;}
  if(q.type==="order"){let n=0;
    app.querySelectorAll(".slot").forEach(b=>{const k=+b.dataset.s;b.disabled=true;const ok=st.seq[k]===k;if(ok)n++;b.classList.add(ok?"good":"bad")});
    app.querySelectorAll("#pool button").forEach(b=>b.disabled=true);
    frac=n/q.items.length;if(frac<1)extra=`${esc(UI.right)} ${q.items.map(fx).join(" → ")}`;}
  if(q.type==="input"){const ia=document.getElementById("ia"),v=norm(ia.value,q);
    frac=q.ans.some(a=>norm(a,q)===v)&&v.length?1:0;ia.disabled=true;ia.classList.add(frac?"good":"bad");
    app.querySelectorAll(".keypad button").forEach(b=>b.disabled=true);
    if(!frac)extra=`${esc(UI.right)} ${fx(q.show)}`;}
  feedback(q,frac,setScore(frac),timeout&&frac===0,extra);
}

function finish(){
  const full=log.filter(f=>f===1).length,pct=log.reduce((a,b)=>a+b,0)/Q.length;
  const stars=pct>=.9?3:pct>=.6?2:pct>=.3?1:0;
  const res=`${UI.resT}\n${UI.resName}: ${name}\n${UI.resScore}: ${score}\n${UI.resRight}: ${full} / ${Q.length}`;
  i=Q.length;hud();
  app.innerHTML=`<p class="muted" style="font-family:var(--display);font-weight:600">${esc(UI.final)}</p>
  <div class="stars">${[0,1,2].map(k=>`<span class="star${k<stars?" on":""}"></span>`).join("")}</div>
  <div class="big">${score}</div>
  <h2>${esc(UI.fully(full,Q.length))}. ${esc(UI.msgs[stars])}</h2>
  <div class="result" id="res">${esc(res)}</div>
  <div class="row"><button class="btn primary" id="cp">${esc(UI.copy)}</button><button class="btn ghost" id="again">${esc(UI.again)}</button></div>
  <p id="cpmsg" class="muted" aria-live="polite"></p>
  <p class="muted" style="font-weight:600">${esc(UI.review)}</p>
  <ol class="review">${Q.map((q,k)=>{const f=log[k];const c=f===1?"ok":f>0?"part":"bad";const s=f===1?"✓":f>0?"~":"✗";const t=T(q.q);
    return `<li><span class="s ${c}">${s}</span>${fx(t.length>90?t.slice(0,90)+"…":t)}</li>`}).join("")}</ol>`;
  window.scrollTo({top:0});
  if(stars>=2)confetti();
  document.getElementById("again").onclick=start;
  document.getElementById("cp").onclick=()=>{
    const m=document.getElementById("cpmsg");
    const sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("res"));const s=getSelection();s.removeAllRanges();s.addRange(r);m.textContent=UI.selected};
    try{navigator.clipboard.writeText(res).then(()=>m.textContent=UI.copied,sel)}catch(e){sel()}
  };
}

function confetti(){
  if(RM)return;
  const cv=document.getElementById("fx"),x=cv.getContext("2d"),d=devicePixelRatio||1;
  cv.width=innerWidth*d;cv.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);
  const cs=getComputedStyle(document.documentElement),cols=["--t1","--t2","--t3","--t4","--brand"].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:110},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*6.28,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){const k=(t-t0)/1400;x.clearRect(0,0,innerWidth,innerHeight);
    if(k>=1)return;
    P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.globalAlpha=1-k;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    requestAnimationFrame(f)})(t0);
}
start();
</script>
